name: 雪拼 CI/CD

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 專案原始碼
        uses: actions/checkout@v4

      - name: 安裝 pnpm
        uses: pnpm/action-setup@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安裝依賴套件
        run: pnpm install --frozen-lockfile

      - name: 檢查 TypeScript 型別 (Type Check)
        run: pnpm --filter web exec tsc --noEmit

      - name: 檢查程式碼風格 (ESLint)
        run: pnpm --filter web lint